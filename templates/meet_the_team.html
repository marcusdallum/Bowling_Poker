<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meet the Team | Duluth Majors at the Incline Station</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8">

    <div class="max-w-4xl w-full bg-white p-8 rounded-xl shadow-2xl border border-gray-100">

        <header class="text-center mb-10">
            <h1 class="text-5xl font-extrabold text-gray-900 tracking-tight sm:text-6xl">
                Meet the Team
            </h1>
        </header>

        <div class="text-center mb-12">
            <h2 class="text-3xl font-semibold text-gray-700 mb-3">
                KG Construction Bowlers
            </h2>
            <p class="text-lg text-gray-500">
                Get to know the legends behind the lanes.
            </p>
        </div>

        <main>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {% for player in players %}
                <div class="bg-indigo-50 p-6 rounded-xl border border-indigo-100 text-center hover:shadow-lg transition-shadow duration-300">
                    <div class="text-4xl mb-4">🎳</div>
                    <h3 class="text-2xl font-bold text-gray-900 mb-2">{{ player }}</h3>
                    <div class="text-sm font-medium text-indigo-600 uppercase tracking-wider">Current Average</div>
                    <div class="text-3xl font-extrabold text-gray-800 mt-1">TBD</div>
                </div>
                {% endfor %}
            </div>
        </main>

        <footer class="mt-12 pt-6 border-t text-center text-sm text-gray-400">
            &copy; 2026 KG Construction | Duluth Majors at the Incline Station
        </footer>
    </div>
</body>
</html>
